# ระบบบริหารงานขนส่ง เทียมเทพ — ชุดรันบน NAS
#
# วางไว้ที่  /volume1/docker/tiamthep/app/  แล้วสั่งจากโฟลเดอร์นั้น
# โครงโฟลเดอร์ที่ไฟล์นี้อ้างถึง:
#
#   /volume1/docker/tiamthep/
#   ├── app/      ← โค้ด (โฟลเดอร์นี้) ลบทิ้งแล้วโคลนใหม่ได้ ไม่กระทบข้อมูล
#   ├── data/
#   │   ├── db/       ไฟล์ฐานข้อมูลจริง ← ห้ามลบ
#   │   └── backup/   ไฟล์สำรองรายวัน
#   └── secrets/
#       ├── .env                          รหัสผ่าน + รหัสชีต
#       └── google-service-account.json   กุญแจ Google
#
# คำสั่ง (อยู่ในโฟลเดอร์ app/):
#   bash scripts/nas/tiamthep.sh up       เปิดระบบ
#   bash scripts/nas/tiamthep.sh update   อัปเดตเป็นเวอร์ชันล่าสุด
#   bash scripts/nas/tiamthep.sh logs     ดูว่าเกิดอะไรขึ้น

name: tiamthep

services:
  db:
    image: postgres:16-alpine
    container_name: tiamthep-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiamthep}
      POSTGRES_USER: ${POSTGRES_USER:-tiamthep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ใน secrets/.env ก่อน}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Bangkok
    # ไม่เปิดพอร์ตออกนอกกล่อง — เข้าถึงได้เฉพาะกล่องอื่นในชุดนี้
    # ถ้าต้องเข้าฐานข้อมูลตรงๆ ใช้  tiamthep.sh psql
    volumes:
      - ../data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiamthep} -d ${POSTGRES_DB:-tiamthep}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # ใช้เน็ตของตัวเครื่องตอน build — บาง NAS (โดยเฉพาะที่ลง Tailscale ไว้)
      # กล่อง Docker จะแปลงชื่อเว็บเป็นไอพีไม่ได้ ทำให้ npm ดึงไลบรารีไม่ลง
      network: host
    image: tiamthep-web:latest
    container_name: tiamthep-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../secrets/.env
    environment:
      TZ: Asia/Bangkok
    # ตั้ง DNS ให้กล่องเว็บโดยเฉพาะ — จำเป็นตอนต่อไปคุยกับ Google Sheet
    # (ไม่ไปแก้ตั้งค่า Docker ของเครื่อง จึงไม่กระทบแอปอื่นบน NAS)
    # ชื่อกล่องในชุดเดียวกันอย่าง "db" ยังแปลงได้ตามปกติ
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      # ซ้ายคือพอร์ตบน NAS (ตั้งใน secrets/.env) · ขวาคือพอร์ตในกล่อง อย่าแก้
      - "${APP_PORT:-3100}:3000"
    volumes:
      # กุญแจ Google — อ่านอย่างเดียว กล่องแก้ไฟล์ไม่ได้
      - ../secrets:/secrets:ro
      # ให้คำสั่งสำรองข้อมูลที่สั่งเองเขียนไฟล์ลงที่เดียวกับตัวสำรองอัตโนมัติ
      - ../data/backup:/app/backup

  backup:
    # ใช้อิมเมจเดียวกับเว็บ — ในนั้นมีทั้ง pg_dump 16, Node และกุญแจ Google ครบ
    # จึงทำได้จบในกล่องเดียว: ดัมป์ → บีบอัด → อัปขึ้น Drive → แจ้งไลน์ผู้ดูแล
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: tiamthep-web:latest
    container_name: tiamthep-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../secrets/.env
    environment:
      TZ: Asia/Bangkok
      # ที่เก็บไฟล์สำรอง "ในกล่อง" — ผูกกับ ../data/backup ของ NAS ข้างล่าง
      BACKUP_DIR: /app/backup
    # ต้องต่อเน็ตได้ (Google Drive + LINE) — DNS ของ Docker บาง NAS แปลงชื่อไม่ได้
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ../data/backup:/app/backup
      - ../secrets:/secrets:ro
    command: ["npx", "tsx", "scripts/backup-daemon.ts"]
